<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Empresa - Ascenda</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">🏢</div>
      <h1>Cadastro de Empresa</h1>
      <p>Preencha os dados para criar uma nova empresa</p>
    </div>
    <div class="auth-card">
      <form id="empresa-form" class="auth-form">
        <div class="form-group input-icon-group">
          <label for="nome">Nome da Empresa</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🏷️</span>
            <input type="text" id="nome" name="nome" placeholder="Ex: Ascenda Ltda" required>
          </div>
        </div>
        <div class="form-group input-icon-group">
          <label for="slug">Identificador (slug)</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🔗</span>
            <input type="text" id="slug" name="slug" placeholder="ex: ascenda" required>
          </div>
        </div>
        <div class="form-group input-icon-group">
          <label for="descricao">Descrição</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">📝</span>
            <textarea id="descricao" name="descricao" rows="3" placeholder="Breve descrição da empresa"></textarea>
          </div>
        </div>
        <div class="form-group input-icon-group">
          <label for="logo">Logo (URL)</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🌐</span>
            <input type="url" id="logo" name="logo" placeholder="https://...">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="empresa-btn">
          <span style="font-size:1.2em;vertical-align:middle;">🚀</span> Cadastrar Empresa
        </button>
        <div id="empresa-error" class="error-message" style="display:none;"></div>
        <div id="empresa-success" class="error-message" style="display:none;background:#d1fae5;color:#065f46;border-color:#a7f3d0;"></div>
      </form>
      <div class="auth-footer">
        <p><a href="../../index.html">Voltar para Home</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="../js/cadastro-empresa.js"></script>
</body>
</html>
