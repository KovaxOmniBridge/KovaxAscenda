<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Papel - Ascenda</title>
    <link rel="stylesheet" href="role-switcher.css">
</head>
<body>
    <div class="container">
        <div class="role-selector-card">
            <!-- Header -->
            <div class="header">
                <h1>👋 Bem-vindo, <span id="userName">Usuário</span>!</h1>
                <p class="subtitle">Você tem acesso a múltiplas áreas. Escolha como deseja acessar:</p>
            </div>

            <!-- Lista de Papéis Disponíveis -->
            <div id="rolesList" class="roles-list">
                <!-- Preenchido dinamicamente pelo JavaScript -->
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>💡 <strong>Dica:</strong> Você pode trocar de papel a qualquer momento dentro do dashboard.</p>
            </div>
        </div>
    </div>

    <script src="role-switcher.js"></script>
</body>
</html>
