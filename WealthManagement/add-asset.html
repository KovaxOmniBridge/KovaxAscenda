<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Ativo - Ascenda</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 id="pageTitle">➕ Adicionar Ativo</h1>
                <button class="btn btn-secondary" onclick="location.href='index.html'">
                    ← Voltar
                </button>
            </div>
        </div>
    </header>

    <section class="form-section">
        <div class="container">
            <div class="form-card">
                <form id="assetForm" onsubmit="handleSubmit(event)">
                    <h2>Informações Básicas</h2>
                    
                    <div class="form-group">
                        <label>Empresa *</label>
                        <select id="companyId" required>
                            <option value="">Selecione uma empresa</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo de Ativo *</label>
                            <select id="type" required onchange="updateFormFields()">
                                <option value="">Selecione o tipo</option>
                                <option value="STORE">🏪 Loja</option>
                                <option value="WAREHOUSE">📦 Estoque/Depósito</option>
                                <option value="REAL_ESTATE">🏢 Imóvel</option>
                                <option value="CLINIC">🏥 Clínica</option>
                                <option value="VEHICLE">🚗 Veículo</option>
                                <option value="EQUIPMENT">⚙️ Equipamento</option>
                                <option value="FURNITURE">🪑 Mobília</option>
                                <option value="OTHER">📋 Outro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Status *</label>
                            <select id="status" required>
                                <option value="ACTIVE">✅ Ativo</option>
                                <option value="INACTIVE">⏸️ Inativo</option>
                                <option value="MAINTENANCE">🔧 Manutenção</option>
                                <option value="RENTED">🔑 Alugado</option>
                                <option value="FOR_SALE">💰 À Venda</option>
                                <option value="SOLD">✔️ Vendido</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nome do Ativo *</label>
                        <input type="text" id="name" placeholder="Ex: Loja Centro" required>
                    </div>

                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="description" placeholder="Descreva o ativo..."></textarea>
                    </div>

                    <h2 style="margin-top: 30px;">Valores</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Valor de Compra</label>
                            <input type="number" id="purchaseValue" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label>Valor Atual</label>
                            <input type="number" id="currentValue" step="0.01" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label>Valor Estimado</label>
                            <input type="number" id="estimatedValue" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Data de Compra</label>
                            <input type="date" id="purchaseDate">
                        </div>

                        <div class="form-group">
                            <label>Tipo de Propriedade *</label>
                            <select id="ownershipType" required>
                                <option value="OWNED">Próprio</option>
                                <option value="RENTED">Alugado</option>
                                <option value="LEASED">Arrendado</option>
                                <option value="FINANCED">Financiado</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Despesa Mensal</label>
                            <input type="number" id="monthlyExpense" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <h2 style="margin-top: 30px;">Localização</h2>

                    <div class="form-group">
                        <label>Endereço</label>
                        <input type="text" id="address" placeholder="Rua, Número">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="city" placeholder="São Paulo">
                        </div>

                        <div class="form-group">
                            <label>Estado</label>
                            <input type="text" id="state" placeholder="SP" maxlength="2">
                        </div>

                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="zipCode" placeholder="00000-000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>País</label>
                            <input type="text" id="country" value="Brasil">
                        </div>

                        <div class="form-group">
                            <label>Latitude</label>
                            <input type="number" id="latitude" step="any" placeholder="-23.5505">
                        </div>

                        <div class="form-group">
                            <label>Longitude</label>
                            <input type="number" id="longitude" step="any" placeholder="-46.6333">
                        </div>
                    </div>

                    <div id="physicalFields" style="display: none;">
                        <h2 style="margin-top: 30px;">Características Físicas</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Área (m²)</label>
                                <input type="number" id="area" step="0.01" placeholder="0.00">
                            </div>

                            <div class="form-group">
                                <label>Capacidade</label>
                                <input type="number" id="capacity" placeholder="0">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Quartos/Salas</label>
                                <input type="number" id="rooms" placeholder="0">
                            </div>

                            <div class="form-group">
                                <label>Andares</label>
                                <input type="number" id="floors" placeholder="0">
                            </div>

                            <div class="form-group">
                                <label>Vagas de Garagem</label>
                                <input type="number" id="parkingSpaces" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <div id="vehicleFields" style="display: none;">
                        <h2 style="margin-top: 30px;">Informações do Veículo</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Marca</label>
                                <input type="text" id="brand" placeholder="Ex: Toyota">
                            </div>

                            <div class="form-group">
                                <label>Modelo</label>
                                <input type="text" id="model" placeholder="Ex: Corolla">
                            </div>

                            <div class="form-group">
                                <label>Ano</label>
                                <input type="number" id="year" placeholder="2023">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Placa</label>
                                <input type="text" id="licensePlate" placeholder="ABC-1234">
                            </div>

                            <div class="form-group">
                                <label>Número de Série</label>
                                <input type="text" id="serialNumber" placeholder="SN123456">
                            </div>
                        </div>
                    </div>

                    <h2 style="margin-top: 30px;">Fotos do Ativo</h2>

                    <div class="form-group">
                        <label>Adicionar Fotos (máx 5MB cada)</label>
                        <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">
                        <div id="photoPreview" class="photo-preview-grid"></div>
                    </div>

                    <h2 style="margin-top: 30px;">Documentos</h2>

                    <div class="form-group">
                        <label>Adicionar Documento</label>
                        <div class="document-input-group">
                            <input type="text" id="documentName" placeholder="Nome do documento">
                            <select id="documentType">
                                <option value="contract">Contrato</option>
                                <option value="deed">Escritura</option>
                                <option value="invoice">Nota Fiscal</option>
                                <option value="other">Outro</option>
                            </select>
                            <input type="file" id="documentFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleDocumentUpload(event)">
                        </div>
                        <div id="documentList" class="document-list"></div>
                    </div>

                    <h2 style="margin-top: 30px;">Informações Adicionais</h2>

                    <div class="form-group">
                        <label>Notas</label>
                        <textarea id="notes" placeholder="Observações adicionais..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Tags (separadas por vírgula)</label>
                        <input type="text" id="tags" placeholder="importante, novo, urgente">
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="isActive" checked>
                            Ativo no sistema
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            💾 Salvar Ativo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <div id="toastContainer" class="toast-container"></div>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/add-asset.js"></script>
</body>
</html>
