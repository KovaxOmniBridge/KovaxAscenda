<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ascenda - Login</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <h1>🚀 Ascenda</h1>
                <p>Portal de Gerenciamento Empresarial</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="accessKey">Chave de Acesso</label>
                    <div class="input-with-icon">
                        <span class="icon">🔑</span>
                        <input 
                            type="text" 
                            id="accessKey" 
                            name="accessKey" 
                            placeholder="EMP-XXXX"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">Cargo</label>
                    <div class="input-with-icon">
                        <span class="icon">👤</span>
                        <select id="role" name="role">
                            <option value="">Selecione seu cargo</option>
                            <option value="ADMIN">👑 Administrador</option>
                            <option value="MANAGER">📊 Gerente</option>
                            <option value="SUPERVISOR">🎯 Supervisor</option>
                            <option value="HR">👥 Recursos Humanos</option>
                            <option value="ACCOUNTANT">💰 Contador</option>
                            <option value="SALES">🛍️ Vendedor</option>
                            <option value="STOCK_KEEPER">📦 Estoquista</option>
                            <option value="CASHIER">💵 Caixa</option>
                            <option value="ATTENDANT">🤝 Atendente</option>
                            <option value="SECURITY">🛡️ Segurança</option>
                            <option value="CLEANER">🧹 Limpeza</option>
                            <option value="MAINTENANCE">🔧 Manutenção</option>
                            <option value="DRIVER">🚗 Motorista</option>
                            <option value="ASSISTANT">📋 Assistente</option>
                            <option value="INTERN">🎓 Estagiário</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-with-icon">
                        <span class="icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    Entrar
                </button>

                <div class="error-message" id="errorMessage" style="display: none;">
                    <span class="error-icon">⚠️</span>
                    <span id="errorText"></span>
                </div>
            </form>

            <div class="footer-info">
                <p>Não tem acesso? Contate o departamento de RH da sua empresa.</p>
            </div>
        </div>

        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
