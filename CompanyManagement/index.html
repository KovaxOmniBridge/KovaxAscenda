<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascenda - Gerenciamento de Empresas</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>ASCENDA</h1>
                <p class="tagline">Gerenciamento Empresarial</p>
            </div>
            <button class="btn-primary" id="btnNovaEmpresa">
                <span class="icon">+</span>
                Nova Empresa
            </button>
        </div>
    </header>

    <main class="main-content">
        <section class="companies-section">
            <div class="section-header">
                <h2>Empresas Cadastradas</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nome, razão social ou CNPJ...">
                </div>
            </div>

            <div id="companiesList" class="companies-grid">
                <!-- As empresas serão carregadas aqui via JavaScript -->
            </div>

            <div id="loadingSpinner" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Carregando empresas...</p>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Nenhuma empresa cadastrada ainda.</p>
                <button class="btn-secondary" onclick="openModal()">Cadastrar primeira empresa</button>
            </div>
        </section>
    </main>

    <!-- Modal de Cadastro/Edição -->
    <div id="companyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nova Empresa</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="companyForm">
                <div class="form-section">
                    <h3>Dados da Empresa</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cnpj">CNPJ *</label>
                            <input type="text" id="cnpj" name="cnpj" required 
                                   placeholder="00.000.000/0000-00" maxlength="18">
                        </div>
                        <div class="form-group">
                            <label for="razaoSocial">Razão Social *</label>
                            <input type="text" id="razaoSocial" name="razaoSocial" required>
                        </div>
                        <div class="form-group">
                            <label for="nomeFantasia">Nome Fantasia *</label>
                            <input type="text" id="nomeFantasia" name="nomeFantasia" required>
                        </div>
                        <div class="form-group">
                            <label for="porte">Porte *</label>
                            <select id="porte" name="porte" required>
                                <option value="">Selecione...</option>
                                <option value="MEI">MEI</option>
                                <option value="ME">ME - Microempresa</option>
                                <option value="EPP">EPP - Empresa de Pequeno Porte</option>
                                <option value="MEDIO">Médio Porte</option>
                                <option value="GRANDE">Grande Porte</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="regimeTributario">Regime Tributário *</label>
                            <select id="regimeTributario" name="regimeTributario" required>
                                <option value="">Selecione...</option>
                                <option value="SIMPLES_NACIONAL">Simples Nacional</option>
                                <option value="LUCRO_PRESUMIDO">Lucro Presumido</option>
                                <option value="LUCRO_REAL">Lucro Real</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="situacaoCadastral">Situação Cadastral *</label>
                            <select id="situacaoCadastral" name="situacaoCadastral" required>
                                <option value="">Selecione...</option>
                                <option value="ATIVA">Ativa</option>
                                <option value="INATIVA">Inativa</option>
                                <option value="SUSPENSA">Suspensa</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Endereço</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" name="cep" required 
                                   placeholder="00000-000" maxlength="9">
                        </div>
                        <div class="form-group">
                            <label for="logradouro">Logradouro *</label>
                            <input type="text" id="logradouro" name="logradouro" required>
                        </div>
                        <div class="form-group">
                            <label for="numero">Número *</label>
                            <input type="text" id="numero" name="numero" required>
                        </div>
                        <div class="form-group">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento" name="complemento">
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro">
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade" name="cidade" required>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado *</label>
                            <input type="text" id="estado" name="estado" required 
                                   placeholder="SP" maxlength="2">
                        </div>
                        <div class="form-group">
                            <label for="pais">País *</label>
                            <input type="text" id="pais" name="pais" required value="Brasil">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
